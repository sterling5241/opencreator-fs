# Z homing: switch first (position_endstop 220), then probe the bed centre and make the touch Z=0
# (needs loadcell.cfg: PROBE tares first)

[gcode_macro G28]
rename_existing: G28.1
gcode:
  G28.1 {rawparams}
  {% if not rawparams or 'Z' in rawparams|upper %}
    _HOME_Z_PROBE
  {% endif %}

[gcode_macro _HOME_Z_PROBE]
gcode:
  {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
    SAVE_GCODE_STATE NAME=home_z_probe
    G90
    G1 Z10 F1500
    G1 X107.5 Y107.5 F12000
    PROBE HOME=Z
    G1 Z5 F800
    RESTORE_GCODE_STATE NAME=home_z_probe
  {% else %}
    {action_respond_info("Z homed to the switch only (home X and Y for the bed probe)")}
  {% endif %}
