# Moonraker Configuration File

[server]
host: 0.0.0.0
port: 7125
# Make sure the klippy_uds_address is correct.  It is initialized
# to the default address.
klippy_uds_address: /tmp/uds

[machine]
provider: none
validate_service: false
validate_config: false

[file_manager]
file_system_observer: none

[authorization]
cors_domains:
  *://*.local
  *://*.lan
  *://localhost
  *://localhost:*
enable_api_key: false
trusted_clients:
  0.0.0.0/0

[update_manager]
refresh_interval: 168
enable_auto_refresh: True
# buildroot has no supported package manager
enable_system_updates: False

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /usr/data/mainsail

[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: /usr/data/fluidd

# OpenCreator configs; 99-opencreator-updater.sh merges them after an update.
[update_manager opencreator]
type: git_repo
path: /usr/data/opencreator/opencreator-fs
origin: https://github.com/FlashForge-C5-Modding-Group/opencreator-fs.git
primary_branch: main
is_system_service: False

# The AD5X's stock camera streams through mjpg_streamer (30-camera.sh).
[webcam printer]
service: mjpegstreamer
stream_url: /webcam/?action=stream
snapshot_url: /webcam/?action=snapshot

[opencreator_3mf]

# Host reboot/shutdown and Klipper/Moonraker restarts on the printer SoC.
[opencreator_machine]

# Phone/chat notifications through Apprise (already installed). Uncomment and
# put in your service's URL: Discord, Telegram, ntfy, Pushover and many more,
# see https://github.com/caronc/apprise/wiki
#[notifier print_events]
#url: tgram://BOT_TOKEN/CHAT_ID
#events: complete, error, cancelled, paused
#title: OpenCreator
#body: Print {event_name}: {event_args[1].filename}
# Door open during a print (needs door notify on: C5_MISC_DOOR_NOTIFY_ON)
#[notifier door_open]
#url: tgram://BOT_TOKEN/CHAT_ID
#events: gcode
#title: OpenCreator
#body: {event_message}

# Spool tracking with a Spoolman server on your network. Uncomment and set
# its address; the active spool is picked in Fluidd or Mainsail.
#[spoolman]
#server: http://192.168.1.100:7912
#sync_rate: 5
