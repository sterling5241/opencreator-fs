# START_PRINT / END_PRINT for the AD5X on Kalico (stock firmwareExe handled this on stock)
# Slicer start gcode: START_PRINT EXTRUDER_TEMP=.. BED_TEMP=.. then a prime line G0 Y219.6, G1 X130 E5
# Ends at X20 Y219.6 Z0.3 with E0 so the slicer prime line draws X20->X130 along the back edge

[gcode_macro START_PRINT]
gcode:
  {% set etemp = params.EXTRUDER_TEMP|default(220)|float %}
  {% set btemp = params.BED_TEMP|default(60)|float %}
  M140 S{btemp}
  M104 S150
  G28
  M190 S{btemp}
  BED_MESH_CALIBRATE
  G90
  G1 Z5 F600
  G1 X20 Y219.6 F12000
  M109 S{etemp}
  G1 Z0.3 F600
  G92 E0

[gcode_macro END_PRINT]
gcode:
  M400
  G92 E0
  G1 E-2 F600
  TURN_OFF_HEATERS
  {% set z = printer.toolhead.position.z %}
  {% set zmax = printer.toolhead.axis_maximum.z %}
  G90
  G1 Z{[z + 5, zmax]|min} F600
  G1 X52.5 Y220 F12000
  M107
  M84

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  M400
  G92 E0
  G1 E-2 F600
  TURN_OFF_HEATERS
  {% if 'xyz' in printer.toolhead.homed_axes %}
  {% set z = printer.toolhead.position.z %}
  {% set zmax = printer.toolhead.axis_maximum.z %}
  G90
  G1 Z{[z + 5, zmax]|min} F600
  G1 X52.5 Y220 F12000
  {% endif %}
  M107
  M84
  BASE_CANCEL_PRINT
