# AD5X IFS (FFP0302_Main_Board_V1.0.4) running Kalico, as an AFC unit
# Draft: pins and driver values from the stock IFS firmware 3.0.7, see NOTES.md

# needs [mcu ifs] (serial: /dev/ttyS4, baud: 115200, restart_method: command) in printer.cfg

[static_digital_output ifs_init]
pins: ifs:PB5, !ifs:PB6          # stock init: PB5 high, PB6 low

[ad5x_filament_sensor fill_sensor]
sensor_pin: eboard:PA3           # stock: present when value <= 0.3 or >= 0.72
present_below: 0.3
present_above: 0.72

[ad5x_filament_sensor cutter]
sensor_pin: eboard:PA2           # cutter blade sensor: idle 0.516, pressed 0.007 (2026-10-24)
present_below: 0.25
present_above: 1.1               # never: triggered = low only

[AFC_extruder extruder]
u1_filament_sensor_name: fill_sensor
tool_stn: 50                   # measured 2026-10-24: filament out of the nozzle between 45 and 55 mm past the sensor
tool_stn_unload: 60            # stock UnloadESpace
tool_sensor_after_extruder: 0
tool_unload_speed: 10          # stock UnloadSpeed 600 mm/min
tool_load_speed: 25

[AFC_IFS IFS_1]
extruder: extruder
drive_stepper: IFS_Drive
selector_stepper: IFS_Selector
home_pin: ^!ifs:PB9
cam_angle: 45
slot_angle: 90
silk_pins: ifs:PC0, ifs:PC2, ifs:PB12, ifs:PB14
selector_movement_speed: 140   # stock TIM6 rate; 90 sat in a resonance band
selector_movement_accel: 4000  # stock has no ramp (constant 140.86 deg/s); high accel skips the ~90 deg/s resonance band
long_moves_speed: 20           # stock feed F1200
long_moves_accel: 100
short_moves_speed: 20
short_moves_accel: 100

[AFC_stepper IFS_Drive]
unit: IFS_1
hub: direct
step_pin: ifs:PA0
dir_pin: !ifs:PA1              # positive = into the IFS toward the printer (verified)
enable_pin: !ifs:PA5           # active low like PB1 (stock F112 stop sets PA5 and PB1 high)
microsteps: 8
rotation_distance: 4.655        # stock 343.696 steps/mm at 8 microsteps (IFS 0x2000032c / 1e6)

[tmc2209 AFC_stepper IFS_Drive]
uart_pin: ifs:PA3
tx_pin: ifs:PA2
uart_address: 0
sense_resistor: 0.500          # TODO: verify R500 are the sense resistors
run_current: 0.25              # keeps Kalico in vsense=0; the real current is set to stock IRUN 9 below
hold_current: 0.01             # stock IHOLD=0, no snap at enable/standstill
interpolate: True
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 5
driver_TBL: 1
driver_IHOLDDELAY: 10
driver_TPOWERDOWN: 128

[AFC_stepper IFS_Selector]
unit: IFS_1
hub: direct
step_pin: ifs:PA7
dir_pin: !ifs:PA6              # stock positive/home seek = PA6 high with GCONF shaft=1
enable_pin: !ifs:PB1
microsteps: 8
full_steps_per_rotation: 2048
rotation_distance: 360

[tmc2209 AFC_stepper IFS_Selector]
uart_pin: ifs:PC5
tx_pin: ifs:PC4
uart_address: 0
sense_resistor: 0.500          # TODO: verify R500 are the sense resistors
run_current: 0.25              # keeps Kalico in vsense=0; the real current is set to stock IRUN 9 below
hold_current: 0.01             # stock IHOLD=0, no snap at enable/standstill
interpolate: True
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 5
driver_TBL: 1
driver_IHOLDDELAY: 10
driver_TPOWERDOWN: 128

[AFC_lane lane1]
unit: IFS_1:1
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead

[AFC_lane lane2]
unit: IFS_1:2
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead

[AFC_lane lane3]
unit: IFS_1:3
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead

[AFC_lane lane4]
unit: IFS_1:4
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead

# The clone TMC2209s deliver far less current in vsense=1 than spec: 0.138 A encoded
# as vsense=1/CS17 clicked over every cam lobe and skipped feed steps, while stock's
# vsense=0/IRUN 9 (the same nominal 0.138 A) runs clean. run_current 0.25 keeps Kalico
# in vsense=0; this trims both motors to stock's exact IRUN after startup.
[delayed_gcode ifs_stock_current]
initial_duration: 2
gcode:
  SET_TMC_FIELD STEPPER=IFS_Selector FIELD=vsense VALUE=0
  SET_TMC_FIELD STEPPER=IFS_Selector FIELD=irun VALUE=9
  SET_TMC_FIELD STEPPER=IFS_Drive FIELD=vsense VALUE=0
  SET_TMC_FIELD STEPPER=IFS_Drive FIELD=irun VALUE=9
