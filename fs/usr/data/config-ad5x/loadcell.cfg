# AD5X bed load cell board on ttyS7: Kalico's load cell command names, sent to the board as H commands
# (no [load_cell] section in this config, so these names are free for macros)

[gcode_shell_command loadcell]
command: sh /usr/data/opencreator/loadcell/loadcell.sh
timeout: 60
verbose: True

[gcode_macro LOAD_CELL_TARE]
description: Zero the bed load cell (H1, checked with H7)
gcode:
  RUN_SHELL_COMMAND CMD=loadcell PARAMS=tare

[gcode_macro LOAD_CELL_READ]
description: Show the bed load cell reading (H7)
gcode:
  RUN_SHELL_COMMAND CMD=loadcell PARAMS=read

[gcode_macro LOAD_CELL_DIAGNOSTIC]
description: Read the bed load cell several times (H7)
gcode:
  RUN_SHELL_COMMAND CMD=loadcell PARAMS="diag {params.COUNT|default(10)|int}"

# stock before every probe session: G1 Z5 F800, M400, tare (nozzle off the bed)
[gcode_macro _LOAD_CELL_PREPARE]
gcode:
  SAVE_GCODE_STATE NAME=load_cell_prepare
  G90
  G1 Z5 F800
  RESTORE_GCODE_STATE NAME=load_cell_prepare
  M400
  LOAD_CELL_TARE

[gcode_macro PROBE]
rename_existing: _PROBE_BASE
gcode:
  _LOAD_CELL_PREPARE
  _PROBE_BASE {rawparams}

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY_BASE
gcode:
  _LOAD_CELL_PREPARE
  _PROBE_ACCURACY_BASE {rawparams}

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE_BASE
gcode:
  _LOAD_CELL_PREPARE
  _PROBE_CALIBRATE_BASE {rawparams}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
gcode:
  _LOAD_CELL_PREPARE
  _BED_MESH_CALIBRATE_BASE {rawparams}
